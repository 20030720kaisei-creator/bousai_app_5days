<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% block head %}{% endblock %}
</head>
<body>
  {% block site_header %}
  <!-- ヘッダー -->
  <h1 style="color: blue;">防災アプリ</h1>

  <!-- ナビゲーション -->
  <nav>
    <a href="/">ホーム</a> |
    <a href="/shelter_search">避難所検索</a> |
    <a href="/shelter_register">避難所登録</a> |
    <a href="/board">指示・発信ボード</a>
    ｜
    {% if session.logged_in %}
      ログイン中{% if session.username %}（{{ session.username }}）{% endif %}
      <a href="/logout">ログアウト</a>
    {% else %}
      未ログイン
      <a href="/login">ログイン</a>
    {% endif %}
  </nav>
  <hr>
  {% endblock %}

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
</body>
</html>
