{% extends "base.html" %}

{% block content %}
<h2>検索結果</h2>
{% if query %}
  <p>「{{ query }}」の検索結果</p>
{% endif %}

{% if results %}
  <ul>
    {% for shelter in results %}
    <li>{{ shelter.name }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>該当する避難所が見つかりませんでした</p>
{% endif %}

<p>
  <a href="/shelter_search">検索画面に戻る</a> |
  <a href="/">トップページへ戻る</a>
</p>
{% endblock %}
