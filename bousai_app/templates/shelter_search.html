{% extends "base.html" %}

{% block content %}
<h2>避難所検索</h2>
<p>避難所名や住所で検索し、設備や混雑状況を比較できます。</p>

<form method="GET" action="{{ url_for('search_results') }}">
	<p>
		<label for="shelter-query">避難所名・住所</label><br>
		<input type="search" id="shelter-query" name="q" value="{{ search_term }}" placeholder="避難所名または住所を入力">
		<button type="submit">検索</button>
	</p>
</form>

<p><a href="/all_shelters">全施設一覧</a></p>
{% endblock %}
