{% extends "base.html" %}

{% block content %}
<h2>避難所検索</h2>
<p>登録されている避難所を確認できます。</p>

<form method="GET" action="{{ url_for('search_results') }}">
	<p>
		<label for="shelter-query">避難所名</label><br>
		<input type="search" id="shelter-query" name="q" placeholder="避難所名を入力" required>
		<button type="submit">検索</button>
	</p>
</form>

<p><a href="/all_shelters">全施設一覧</a></p>
{% endblock %}
